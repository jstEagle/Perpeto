name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run verify:upstream
      - run: npm run typecheck -w @perpeto/web
      - run: npm test -w @perpeto/web
      - run: npm run build:web
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - run: npm run setup
      - run: npm run test:upstream
      - run: npm run build
      - run: npm run smoke:messaging
