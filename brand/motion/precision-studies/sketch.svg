<svg xmlns="http://www.w3.org/2000/svg" viewBox="219 186 816 816" width="96" height="96" class="loader motion-sketch" role="img" aria-label="Sketch loading animation"><style>
.loader{color:var(--logo-color,#202521);overflow:visible}
.loader .rotor,.loader .arm{transform-origin:627px 594px}
.motion-etch path,.motion-sketch path{fill:none;stroke:currentColor;stroke-width:130;stroke-linejoin:round;stroke-dasharray:1}
.motion-etch path{animation:etch 4s ease-in-out infinite}
.motion-etch .rotor{animation:turn 12s linear infinite}
@keyframes etch{0%,100%{stroke-dashoffset:1;opacity:.25}40%,70%{stroke-dashoffset:0;opacity:1}95%{stroke-dashoffset:-1;opacity:.25}}
.motion-sketch .arm{animation:sketch-arm 4s ease-in-out infinite;animation-delay:calc(var(--i)*.17s - 4s)}
.motion-sketch path{animation:sketch 4s ease-in-out infinite;animation-delay:calc(var(--i)*.17s - 4s)}
@keyframes sketch{0%,100%{stroke-dashoffset:1}30%,75%{stroke-dashoffset:0}}
@keyframes sketch-arm{0%,100%{opacity:.15}30%,75%{opacity:1}}
.motion-cam .rotor{animation:cam 3.6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes cam{0%,10%{transform:rotate(0) scale(1)}27%{transform:rotate(90deg) scale(.82)}45%,55%{transform:rotate(180deg) scale(1)}72%{transform:rotate(270deg) scale(.82)}90%,100%{transform:rotate(360deg) scale(1)}}
.motion-release .rotor{animation:turn 6s linear infinite}
.motion-release .arm{animation:release 3s cubic-bezier(.22,1,.36,1) infinite}
@keyframes release{0%,20%,100%{transform:translate(0,0);opacity:1}38%{transform:translate(var(--dx),var(--dy));opacity:.6}68%{transform:translate(0,0);opacity:1}}
.motion-comet .rotor{animation:turn 4s linear infinite}
.motion-comet .arm{animation:comet 2s linear infinite;animation-delay:calc(var(--i)*.25s - 2s)}
@keyframes comet{0%,100%{opacity:1}12%{opacity:.8}65%,85%{opacity:.08}}
.motion-gather .arm{animation:gather 4s cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--i)*.08s - 4s)}
@keyframes gather{0%,100%{transform:rotate(0) scale(1);opacity:1}38%,52%{transform:rotate(-32deg) scale(.6);opacity:.5}80%{transform:rotate(0) scale(1);opacity:1}}
@keyframes turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loader .rotor,.loader .arm,.loader path{animation:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}}
