<svg xmlns="http://www.w3.org/2000/svg" viewBox="219 186 816 816" width="96" height="96" class="loader motion-latch" role="img" aria-label="Latch loading animation"><style>
.loader{color:var(--logo-color,#202521);overflow:visible}
.motion-relay-gap .arm{animation:relay-gap 2.4s linear infinite;animation-delay:calc(var(--i)*.3s - 2.4s)}
@keyframes relay-gap{0%,20%,100%{opacity:1}4%,12%{opacity:.08}}
.motion-packet .arm{animation:packet 3.2s steps(1,end) infinite;animation-delay:calc(var(--pair)*.8s - 3.2s)}
@keyframes packet{0%,24%{opacity:1}25%,100%{opacity:.13}}
.motion-dock .arm{animation:dock 3.6s cubic-bezier(.22,1,.36,1) infinite;animation-delay:calc(var(--i)*.1s - 3.6s)}
@keyframes dock{0%,100%{transform:translate(calc(var(--dx)*.7),calc(var(--dy)*.7));opacity:.2}24%{transform:translate(calc(var(--dx)*-.06),calc(var(--dy)*-.06));opacity:1}34%,72%{transform:translate(0,0);opacity:1}90%{transform:translate(calc(var(--dx)*.7),calc(var(--dy)*.7));opacity:.2}}
.motion-latch .arm{animation:latch 3.6s ease-in-out infinite;animation-delay:calc(var(--pair)*.6s - 3.6s)}
@keyframes latch{0%,55%,100%{transform:translate(0,0)}20%,35%{transform:translate(calc(var(--dx)*.55),calc(var(--dy)*.55))}}
.motion-bounce .arm{animation:bounce 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.16s - 3.2s)}
@keyframes bounce{0%,45%,100%{transform:translateY(0)}18%{transform:translateY(-40px)}30%{transform:translateY(7px)}}
.motion-rendezvous .arm{animation:rendezvous 4s cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--pair)*.12s - 4s)}
@keyframes rendezvous{0%,100%{opacity:.12}18%,62%{opacity:1}75%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.loader .arm{animation:none!important;transform:none!important;opacity:1!important}}
