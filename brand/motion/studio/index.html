.loader {color:var(--logo-color,#202521);overflow:visible}
.loader .rotor{transform-origin:627px 594px}

.motion-spin .rotor{animation:perpeto-spin 2.4s linear 10}

@keyframes perpeto-pulse{0%,100%{opacity:1}20%{opacity:.72}65%{opacity:.2}85%{opacity:.2}}
@keyframes perpeto-assemble{0%,100%{opacity:0;transform:translate(var(--dx),var(--dy))}24%,70%{opacity:1;transform:translate(0,0)}90%{opacity:0;transform:translate(var(--dx),var(--dy))}}
